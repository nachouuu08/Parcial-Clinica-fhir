<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reportes y Estadísticas - FHIR</title>
    <link rel="stylesheet" href="/static/vendor/fonts.css">
    <script src="/static/vendor/phosphor-icons.js"></script>
    <script src="/static/vendor/chart.js"></script>
    <script src="/static/auth-helper.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: #f0f2f5;
            min-height: 100vh;
            padding: 2rem;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
        }

        .header {
            background: linear-gradient(135deg, #2c3e50 0%, #000000 100%);
            color: white;
            padding: 2rem;
            border-radius: 15px;
            margin-bottom: 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(450px, 1fr));
            gap: 2rem;
            margin-bottom: 2rem;
        }

        .card {
            background: white;
            padding: 2rem;
            border-radius: 15px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }

        .card h2 {
            font-size: 1.25rem;
            color: #2d3748;
            margin-bottom: 1.5rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .btn-back {
            background: rgba(255,255,255,0.1);
            color: white;
            padding: 0.75rem 1rem;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            transition: background 0.3s;
        }

        .btn-back:hover { background: rgba(255,255,255,0.2); }

        .table-recientes {
            width: 100%;
            border-collapse: collapse;
            margin-top: 1rem;
        }

        .table-recientes th {
            text-align: left;
            padding: 0.75rem;
            border-bottom: 2px solid #edf2f7;
            color: #718096;
            font-size: 0.85rem;
        }

        .table-recientes td {
            padding: 0.75rem;
            border-bottom: 1px solid #edf2f7;
            font-size: 0.9rem;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="header">
            <div>
                <h1><i class="ph ph-chart-line-up"></i> Sistema de Reportes</h1>
                <p>Métricas Operacionales y Clínicas Consolidadas</p>
            </div>
            <a href="/" class="btn-back"><i class="ph ph-arrow-left"></i> Volver</a>
        </div>

        <div class="stats-grid">
            <div class="card">
                <h2><i class="ph ph-map-pin"></i> Distribución por Sede</h2>
                <canvas id="chartSedes"></canvas>
            </div>
            <div class="card">
                <h2><i class="ph ph-activity"></i> Volumen por Nivel de Triage</h2>
                <canvas id="chartTriage"></canvas>
            </div>
            <div class="card" style="grid-column: 1 / -1;">
                <h2><i class="ph ph-clock-counter-clockwise"></i> Últimos Registros en la Red</h2>
                <table class="table-recientes">
                    <thead>
                        <tr>
                            <th>IDENTIFICACIÓN</th>
                            <th>NOMBRE COMPLETO</th>
                            <th>SEDE ORIGEN</th>
                            <th>FECHA REGISTRO</th>
                        </tr>
                    </thead>
                    <tbody id="listaRecientes">
                        <!-- Se llena vía JS -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        async function loadData() {
            try {
                const response = await AuthHelper.authenticatedFetch('/api/reportes/estadisticas');
                const data = await response.json();

                renderChartSedes(data.pacientes_sede);
                renderChartTriage(data.triage_niveles);
                renderTable(data.recientes);
            } catch (error) {
                console.error('Error cargando reportes:', error);
            }
        }

        function renderChartSedes(data) {
            const ctx = document.getElementById('chartSedes').getContext('2d');
            new Chart(ctx, {
                type: 'pie',
                data: {
                    labels: data.map(d => d.sede),
                    datasets: [{
                        data: data.map(d => d.total),
                        backgroundColor: ['#667eea', '#764ba2', '#ed8936']
                    }]
                },
                options: { responsive: true }
            });
        }

        function renderChartTriage(data) {
            const ctx = document.getElementById('chartTriage').getContext('2d');
            new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: data.map(d => `Nivel ${d.nivel_triage}`),
                    datasets: [{
                        label: 'Pacientes',
                        data: data.map(d => d.total),
                        backgroundColor: (ctx) => {
                            const colors = ['#e53e3e', '#ed8936', '#ecc94b', '#48bb78', '#4299e1'];
                            return colors[ctx.dataIndex] || '#CBD5E0';
                        }
                    }]
                },
                options: {
                    responsive: true,
                    scales: { y: { beginAtZero: true, ticks: { stepSize: 1 } } }
                }
            });
        }

        function renderTable(pacientes) {
            const tbody = document.getElementById('listaRecientes');
            tbody.innerHTML = pacientes.map(p => `
                <tr>
                    <td><strong>${p.paciente_id}</strong></td>
                    <td>${p.nombre} ${p.apellido}</td>
                    <td><span style="background: #EBF4FF; color: #2B6CB0; padding: 0.2rem 0.5rem; border-radius: 5px; font-size: 0.75rem; font-weight: 700;">${p.ciudad_registro_origen}</span></td>
                    <td>${new Date(p.fecha_creacion).toLocaleString()}</td>
                </tr>
            `).join('');
        }

        window.addEventListener('DOMContentLoaded', loadData);
    </script>
</body>

</html>
